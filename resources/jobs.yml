resources:
  jobs:
    inventory_optimization_crash_course:
      name: "inventory-optimization-crash-course"
      description: "Run the public inventory optimization notebook on serverless, compare solver libraries in MLflow, and optionally deploy the champion."
      tasks:
        - task_key: run_inventory_notebook
          notebook_task:
            notebook_path: ../notebooks/inventory_optimization_crash_course.py
            base_parameters:
              experiment_name: ${var.experiment_name}
              model_name: ${var.model_name}
              endpoint_name: ${var.endpoint_name}
              catalog: ${var.catalog}
              schema: ${var.schema}
              seed: ${var.seed}
              scenario_count: ${var.scenario_count}
              small_sku_counts: ${var.small_sku_counts}
              deploy_endpoint: ${var.deploy_endpoint}
              run_large_benchmark: ${var.run_large_benchmark}
              large_product_count: ${var.large_product_count}
              large_source_count: ${var.large_source_count}
              large_dc_count: ${var.large_dc_count}
              large_store_count: ${var.large_store_count}
              large_sources_per_dc: ${var.large_sources_per_dc}
              large_dcs_per_store: ${var.large_dcs_per_store}
              large_time_limit_s: ${var.large_time_limit_s}
              large_experiment_name: ${var.large_experiment_name}
              large_benchmark_id: ${var.large_benchmark_id}
          timeout_seconds: 5400
      permissions:
        - level: CAN_VIEW
          group_name: "users"

    inventory_optimization_cuopt_gpu:
      name: "inventory-optimization-cuopt-gpu"
      description: "Run the NVIDIA cuOpt companion notebook on serverless GPU compute and optionally deploy the cuOpt champion to GPU Model Serving."
      environments:
        - environment_key: ai_runtime
          spec:
            environment_version: ${var.gpu_environment_version}
      tasks:
        - task_key: run_cuopt_gpu_notebook
          notebook_task:
            notebook_path: ../notebooks/inventory_optimization_cuopt_gpu.py
            base_parameters:
              experiment_name: ${var.experiment_name}
              model_name: ${var.gpu_model_name}
              endpoint_name: ${var.gpu_endpoint_name}
              catalog: ${var.catalog}
              schema: ${var.schema}
              seed: ${var.seed}
              scenario_count: ${var.scenario_count}
              small_sku_counts: ${var.small_sku_counts}
              deploy_endpoint: ${var.deploy_endpoint}
              gpu_serving_workload_type: ${var.gpu_serving_workload_type}
              run_large_benchmark: ${var.run_large_benchmark}
              large_product_count: ${var.large_product_count}
              large_source_count: ${var.large_source_count}
              large_dc_count: ${var.large_dc_count}
              large_store_count: ${var.large_store_count}
              large_sources_per_dc: ${var.large_sources_per_dc}
              large_dcs_per_store: ${var.large_dcs_per_store}
              large_time_limit_s: ${var.large_time_limit_s}
              large_experiment_name: ${var.large_experiment_name}
              large_benchmark_id: ${var.large_benchmark_id}
          environment_key: ai_runtime
          compute:
            hardware_accelerator: ${var.gpu_hardware_accelerator}
          timeout_seconds: 7200
      permissions:
        - level: CAN_VIEW
          group_name: "users"

    inventory_optimization_large_benchmark:
      name: "inventory-optimization-large-benchmark"
      description: "Run the large-scale CPU vs GPU benchmark on a sparse distribution-network LP. Both runtimes log to one shared MLflow experiment so the team can compare cuOpt and SciPy/HiGHS apples-to-apples."
      environments:
        - environment_key: ai_runtime
          spec:
            environment_version: ${var.gpu_environment_version}
      tasks:
        - task_key: run_large_cpu_benchmark
          notebook_task:
            notebook_path: ../notebooks/inventory_optimization_crash_course.py
            base_parameters:
              experiment_name: ${var.experiment_name}
              model_name: "${var.model_name}_large_benchmark"
              endpoint_name: ${var.endpoint_name}
              catalog: ${var.catalog}
              schema: ${var.schema}
              seed: ${var.seed}
              scenario_count: ${var.scenario_count}
              small_sku_counts: ${var.small_sku_counts}
              deploy_endpoint: "false"
              run_large_benchmark: "true"
              large_product_count: ${var.large_product_count}
              large_source_count: ${var.large_source_count}
              large_dc_count: ${var.large_dc_count}
              large_store_count: ${var.large_store_count}
              large_sources_per_dc: ${var.large_sources_per_dc}
              large_dcs_per_store: ${var.large_dcs_per_store}
              large_time_limit_s: ${var.large_time_limit_s}
              large_experiment_name: ${var.large_experiment_name}
              large_benchmark_id: ${var.large_benchmark_id}
          timeout_seconds: 7200
        - task_key: run_large_gpu_benchmark
          depends_on:
            - task_key: run_large_cpu_benchmark
          notebook_task:
            notebook_path: ../notebooks/inventory_optimization_cuopt_gpu.py
            base_parameters:
              experiment_name: ${var.experiment_name}
              model_name: "${var.gpu_model_name}_large_benchmark"
              endpoint_name: ${var.gpu_endpoint_name}
              catalog: ${var.catalog}
              schema: ${var.schema}
              seed: ${var.seed}
              scenario_count: ${var.scenario_count}
              small_sku_counts: ${var.small_sku_counts}
              deploy_endpoint: "false"
              gpu_serving_workload_type: ${var.gpu_serving_workload_type}
              run_large_benchmark: "true"
              large_product_count: ${var.large_product_count}
              large_source_count: ${var.large_source_count}
              large_dc_count: ${var.large_dc_count}
              large_store_count: ${var.large_store_count}
              large_sources_per_dc: ${var.large_sources_per_dc}
              large_dcs_per_store: ${var.large_dcs_per_store}
              large_time_limit_s: ${var.large_time_limit_s}
              large_experiment_name: ${var.large_experiment_name}
              large_benchmark_id: ${var.large_benchmark_id}
          environment_key: ai_runtime
          compute:
            hardware_accelerator: ${var.gpu_hardware_accelerator}
          timeout_seconds: 7200
      permissions:
        - level: CAN_VIEW
          group_name: "users"
